<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사칙연산 계산기</title>
    <script src="./caculator.js"></script>
    <style>
        p {
            font-size: medium;
        }

        .p2 {
            font-weight: lighter;
        }
    </style>
</head>
<body>
    <h1>콘솔창 계산기 프로그램
        <p>Window OS의 경우</p>
        <hr>
        <p class="p2">1. F12 키를 눌러 콘솔 창을 여세요.</p>
        <p class="p2">2. start() 콘솔창에 입력하여 계산기를 실행합니다.</p>
        <p>Mac OS의 경우</p>
        <hr>
        <p class="p2">1. Option + Command + i 키를 눌러 콘솔 창을 여세요.</p>
        <p class="p2">2. start()를 콘솔창에 입력하여 계산기를 실행합니다.</p>
    </h1>
</body>
</html>
